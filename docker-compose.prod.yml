# Production overlay — layered on top of the base compose file, never used alone:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it changes versus the dev/demo default:
#   - Postgres is NOT published on the host (the api reaches db over the compose network);
#   - the api container publishes NO host port either — Caddy terminates TLS on 80/443 and is the
#     only ingress; the app is reachable solely over the compose network at api:8000;
#   - POSTGRES_PASSWORD and MCA_DATABASE_URL are required from the environment with no default,
#     so compose refuses to render — let alone start — if either is missing;
#   - api and db restart automatically (unless-stopped) so a host reboot brings the stack back.
# Supply the values from an env file, e.g. `--env-file .env.prod`; the full production posture
# (.env.prod.example) ships with the VPS bring-up slice.
services:
  db:
    # !reset drops the base file's "5432:5432" publish outright. A plain empty list would be
    # merged with the base list, not replace it.
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (no default in production)}
    restart: unless-stopped

  api:
    # Same !reset mechanic as db above: drop the base file's "8000:8000" publish. In production
    # the only listener on the host is caddy; nothing should be able to reach uvicorn directly
    # and bypass TLS, the edge, and the real client IP that the limiter keys on.
    ports: !reset []
    environment:
      MCA_DATABASE_URL: ${MCA_DATABASE_URL:?set MCA_DATABASE_URL (no default in production)}
      # The base compose file enumerates the api env explicitly, so every prod-only var must
      # be forwarded here or it silently never reaches the container. Required, no default:
      # the production spend posture must be stated explicitly (0 disables the budget).
      MCA_ASSISTANT_TOKEN_BUDGET_PER_DAY: ${MCA_ASSISTANT_TOKEN_BUDGET_PER_DAY:?set MCA_ASSISTANT_TOKEN_BUDGET_PER_DAY (0 disables the daily token budget)}
      # Optional override (null value = pass through from the host env only when set,
      # so the app default of 7 applies otherwise; no inline fallback default, per the
      # overlay rule).
      MCA_DATA_STALENESS_DAYS:
    restart: unless-stopped

  # Nightly ingest automation. Only starts with an explicit profile:
  #
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile ops up -d --build
  #
  # Dev/demo stacks and a plain prod bring-up never render it. MCA_ADMIN_INGEST_TOKEN is passed
  # through from the operator's environment (list form, not interpolation — a "${VAR:?}" here
  # would break every render that does not use the profile, since Compose interpolates the whole
  # file before it filters by profile) and never appears in the crontab.
  ingest-cron:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: deploy/ingest-cron.Dockerfile
    command: ["crond", "-f", "-d", "8"]
    environment:
      - MCA_ADMIN_INGEST_TOKEN
      - TZ=America/Los_Angeles
    volumes:
      - ./deploy/ingest-cron.crontab:/etc/crontabs/root:ro
      - ./deploy/ingest-daily.sh:/etc/ingest/run.sh:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # TLS edge. Caddy obtains and renews the Let's Encrypt certificate for the site name in
  # deploy/Caddyfile on its own; 80 must stay open for the ACME HTTP challenge and the
  # HTTP->HTTPS redirect, and 443/udp gives HTTP/3. The named volumes make certificates and
  # OCSP staples survive a container replacement — without them a redeploy re-issues and can
  # hit Let's Encrypt rate limits. depends_on is the short form on purpose: a service_healthy
  # condition would hold the edge down (and the ACME challenge unanswered) while api migrates.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
