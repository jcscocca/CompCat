version: 2
updates:
  # Backend Python dependencies (pyproject.toml). Minor/patch bumps are grouped;
  # majors arrive as individual PRs so each breaking change is assessed alone.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # Frontend npm dependencies (frontend/package.json). Same split as pip.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Capacitor majors are an intentional iOS-shell migration (docs/IOS.md is
      # Capacitor-7-specific and CI does not build iOS), not a routine bump.
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # GitHub Actions used by CI (.github/workflows).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Base images. The app image (python:3.11-slim + node:22-slim builder) and the ops
  # sidecar (alpine:3.22) are pinned, so without this they only move when someone
  # remembers to bump them — which is how a deployed image quietly accumulates CVEs.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
