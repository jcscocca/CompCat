name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest tests -q

  backend-postgres:
    # Proves migrations apply and the app runs on Postgres (the deploy DB), not just SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mca
          POSTGRES_USER: mca
          POSTGRES_PASSWORD: mca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mca -d mca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCA_DATABASE_URL: postgresql+psycopg://mca:mca@localhost:5432/mca
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Migrate to head on Postgres
        run: alembic upgrade head
      - name: Postgres parity smoke + migration FK guards
        run: pytest tests/test_postgres_smoke.py tests/test_migrations.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .
      - name: Production overlay renders without publishing Postgres
        env:
          POSTGRES_PASSWORD: ci-not-a-real-password
          MCA_DATABASE_URL: postgresql+psycopg://mca:ci-not-a-real-password@db:5432/mca
          MCA_ASSISTANT_TOKEN_BUDGET_PER_DAY: "0"
        run: |
          docker compose --env-file /dev/null \
            -f docker-compose.yml -f docker-compose.prod.yml config > rendered.yml
          # "! cmd" is exempt from set -e; an if/exit keeps the assertion load-bearing.
          if grep -q 'published: "5432"' rendered.yml; then
            echo "prod overlay must not publish 5432" >&2
            exit 1
          fi
          grep -q 'published: "8000"' rendered.yml
          grep -q 'MCA_ASSISTANT_TOKEN_BUDGET_PER_DAY' rendered.yml
          test "$(grep -c 'restart: unless-stopped' rendered.yml)" = "2"
