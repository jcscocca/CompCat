      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chromium Unix sockets require a short path, even when _work is deeply nested.
          job_tmp=$(mktemp -d /tmp/gha.XXXXXX)
          echo "CI_JOB_TEMP=$job_tmp" >> "$GITHUB_ENV"
          mkdir -p "$job_tmp" "$HOME/.cache"
