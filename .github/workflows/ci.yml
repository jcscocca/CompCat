name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: "1"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"
  GOMAXPROCS: "2"
  RAYON_NUM_THREADS: "2"
  UV_THREADPOOL_SIZE: "2"

# Manual acceptance runs retain their own group; PR updates and trusted closure
# controls share the PR number, so retirement happens before allocating a worker.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('ci-manual-{0}-{1}', github.run_id, github.run_attempt) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  untrusted-fork:
    name: Fork CI policy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: [self-hosted, Linux, thinkpad]
    timeout-minutes: 5
    steps:
      - name: Require a reviewed repository branch
        run: |
          printf '%s\n' '::error::Fork heads cannot execute on self-hosted runners. Review the change and use a repository branch for full CI verification.'
          exit 1

  retire-closed-pr:
    name: Retire closed PR
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: [self-hosted, Linux, thinkpad]
    timeout-minutes: 5
    steps:
      - name: Confirm retirement
        run: |
          printf '%s\n' 'Closed PR: previous ci run retired by the PR concurrency group.' >> "$GITHUB_STEP_SUMMARY"

  backend:
    if: github.event_name != 'pull_request_target' && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 15
    runs-on: [self-hosted, Linux, thinkpad]
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
          persist-credentials: false
      - name: Retain isolated checkouts for fourteen days
        if: runner.environment == 'self-hosted'
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(path.join(process.env.GITHUB_WORKSPACE, 'work'));
          const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
          for (const name of fs.readdirSync(root)) {
            if (!/^[0-9]+-[0-9]+-[A-Za-z0-9_-]+-[0-9]+$/.test(name)) continue;
            const target = path.join(root, name);
            const stat = fs.lstatSync(target);
            if (!stat.isDirectory() || stat.isSymbolicLink() || stat.mtimeMs >= cutoff) continue;
            if (!fs.realpathSync(target).startsWith(root + path.sep)) throw new Error('Unsafe cleanup path');
            fs.rmSync(target, {recursive: true, force: true});
          }
      # Each registration has its own _work root; each job checks out a fresh subdirectory.
      # GitHub Runner cleans RUNNER_TEMP and terminates processes carrying this job's tracking ID.
      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chromium Unix sockets require a short path, even when _work is deeply nested.
          job_tmp=$(mktemp -d /tmp/gha.XXXXXX)
          echo "CI_JOB_TEMP=$job_tmp" >> "$GITHUB_ENV"
          mkdir -p "$job_tmp" "$HOME/.cache"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Isolate Python dependencies and temporary files
        shell: python {0}
        run: |
          import os, pathlib, tempfile, venv
          root = pathlib.Path(tempfile.mkdtemp(prefix="ci-python-", dir=os.environ["RUNNER_TEMP"]))
          venv.create(root / "venv", with_pip=True)
          (root / "tmp").mkdir()
          with open(os.environ["GITHUB_PATH"], "a") as output:
              print(root / "venv" / ("Scripts" if os.name == "nt" else "bin"), file=output)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print("VIRTUAL_ENV=" + str(root / "venv"), file=output)
              print("PYTHONNOUSERSITE=1", file=output)
              for key in ("TMPDIR", "TMP", "TEMP"):
                  print(key + "=" + os.environ.get("CI_JOB_TEMP", str(root / "tmp")), file=output)
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest tests -q
      - name: Remove this job's Linux temporary directory
        if: always() && runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          case "${CI_JOB_TEMP:-}" in
            /tmp/gha.*) rm -rf -- "$CI_JOB_TEMP" ;;
            '') ;;
            *) echo "Unexpected temporary directory; refusing cleanup" >&2; exit 1 ;;
          esac

  backend-postgres:
    if: github.event_name != 'pull_request_target' && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 15
    # Proves migrations apply and the app runs on Postgres (the deploy DB), not just SQLite.
    runs-on: [self-hosted, Linux, thinkpad]
    services:
      postgres:
