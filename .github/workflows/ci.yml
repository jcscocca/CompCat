          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/frontend/package-lock.json
      - run: npm ci
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/frontend
      - run: npm test -- --maxWorkers=2
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/frontend
      - run: npm run build
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/frontend
      - name: Remove this job's Linux temporary directory
        if: always() && runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          case "${CI_JOB_TEMP:-}" in
            /tmp/gha.*) rm -rf -- "$CI_JOB_TEMP" ;;
            '') ;;
            *) echo "Unexpected temporary directory; refusing cleanup" >&2; exit 1 ;;
          esac

  frontend:
    if: github.event_name != 'pull_request_target' && github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 20
    # Keep the existing frontend check as the final browser gate. Complete the
    # other required checks before allocating its isolated browser container.
    needs: [backend, backend-postgres, docker, frontend-unit]
    runs-on: [self-hosted, Linux, "${{ vars.CI_BROWSER_RUNNER_LABEL || 'thinkpad' }}"]
    concurrency:
      group: thinkpad-compcat-browser
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
          persist-credentials: false
      - name: Retain isolated checkouts for fourteen days
        if: runner.environment == 'self-hosted'
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(path.join(process.env.GITHUB_WORKSPACE, 'work'));
          const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
          for (const name of fs.readdirSync(root)) {
