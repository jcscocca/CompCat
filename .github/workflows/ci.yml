name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: [self-hosted, Linux, thinkpad]
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
      - name: Retain isolated checkouts for fourteen days
        if: runner.environment == 'self-hosted'
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(path.join(process.env.GITHUB_WORKSPACE, 'work'));
          const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
          for (const name of fs.readdirSync(root)) {
            if (!/^[0-9]+-[0-9]+-[A-Za-z0-9_-]+-[0-9]+$/.test(name)) continue;
            const target = path.join(root, name);
            const stat = fs.lstatSync(target);
            if (!stat.isDirectory() || stat.isSymbolicLink() || stat.mtimeMs >= cutoff) continue;
            if (!fs.realpathSync(target).startsWith(root + path.sep)) throw new Error('Unsafe cleanup path');
            fs.rmSync(target, {recursive: true, force: true});
          }
      # Each registration has its own _work root; each job checks out a fresh subdirectory.
      # GitHub Runner cleans RUNNER_TEMP and terminates processes carrying this job's tracking ID.
      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chromium Unix sockets require a short path, even when _work is deeply nested.
          job_tmp=$(mktemp -d /tmp/gha.XXXXXX)
          echo "CI_JOB_TEMP=$job_tmp" >> "$GITHUB_ENV"
          mkdir -p "$job_tmp" "$HOME/.cache"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Isolate Python dependencies and temporary files
        shell: python {0}
        run: |
          import os, pathlib, tempfile, venv
          root = pathlib.Path(tempfile.mkdtemp(prefix="ci-python-", dir=os.environ["RUNNER_TEMP"]))
          venv.create(root / "venv", with_pip=True)
          (root / "tmp").mkdir()
          with open(os.environ["GITHUB_PATH"], "a") as output:
              print(root / "venv" / ("Scripts" if os.name == "nt" else "bin"), file=output)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print("VIRTUAL_ENV=" + str(root / "venv"), file=output)
              print("PYTHONNOUSERSITE=1", file=output)
              for key in ("TMPDIR", "TMP", "TEMP"):
                  print(key + "=" + os.environ.get("CI_JOB_TEMP", str(root / "tmp")), file=output)
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest tests -q
      - name: Remove this job's Linux temporary directory
        if: always() && runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          case "${CI_JOB_TEMP:-}" in
            /tmp/gha.*) rm -rf -- "$CI_JOB_TEMP" ;;
            '') ;;
            *) echo "Unexpected temporary directory; refusing cleanup" >&2; exit 1 ;;
          esac

  backend-postgres:
    # Proves migrations apply and the app runs on Postgres (the deploy DB), not just SQLite.
    runs-on: [self-hosted, Linux, thinkpad]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mca
          POSTGRES_USER: mca
          POSTGRES_PASSWORD: mca
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U mca -d mca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
      - name: Retain isolated checkouts for fourteen days
        if: runner.environment == 'self-hosted'
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(path.join(process.env.GITHUB_WORKSPACE, 'work'));
          const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
          for (const name of fs.readdirSync(root)) {
            if (!/^[0-9]+-[0-9]+-[A-Za-z0-9_-]+-[0-9]+$/.test(name)) continue;
            const target = path.join(root, name);
            const stat = fs.lstatSync(target);
            if (!stat.isDirectory() || stat.isSymbolicLink() || stat.mtimeMs >= cutoff) continue;
            if (!fs.realpathSync(target).startsWith(root + path.sep)) throw new Error('Unsafe cleanup path');
            fs.rmSync(target, {recursive: true, force: true});
          }
      # Each registration has its own _work root; each job checks out a fresh subdirectory.
      # GitHub Runner cleans RUNNER_TEMP and terminates processes carrying this job's tracking ID.
      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chromium Unix sockets require a short path, even when _work is deeply nested.
          job_tmp=$(mktemp -d /tmp/gha.XXXXXX)
          echo "CI_JOB_TEMP=$job_tmp" >> "$GITHUB_ENV"
          mkdir -p "$job_tmp" "$HOME/.cache"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Isolate Python dependencies and temporary files
        shell: python {0}
        run: |
          import os, pathlib, tempfile, venv
          root = pathlib.Path(tempfile.mkdtemp(prefix="ci-python-", dir=os.environ["RUNNER_TEMP"]))
          venv.create(root / "venv", with_pip=True)
          (root / "tmp").mkdir()
          with open(os.environ["GITHUB_PATH"], "a") as output:
              print(root / "venv" / ("Scripts" if os.name == "nt" else "bin"), file=output)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print("VIRTUAL_ENV=" + str(root / "venv"), file=output)
              print("PYTHONNOUSERSITE=1", file=output)
              for key in ("TMPDIR", "TMP", "TEMP"):
                  print(key + "=" + os.environ.get("CI_JOB_TEMP", str(root / "tmp")), file=output)
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Migrate to head on Postgres
        env:
          MCA_DATABASE_URL: postgresql+psycopg://mca:mca@localhost:${{ job.services.postgres.ports['5432'] }}/mca
        run: alembic upgrade head
      - name: Postgres parity smoke + migration FK guards
        env:
          MCA_DATABASE_URL: postgresql+psycopg://mca:mca@localhost:${{ job.services.postgres.ports['5432'] }}/mca
        run: pytest tests/test_postgres_smoke.py tests/test_migrations.py -q
      - name: Remove this job's Linux temporary directory
        if: always() && runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          case "${CI_JOB_TEMP:-}" in
            /tmp/gha.*) rm -rf -- "$CI_JOB_TEMP" ;;
            '') ;;
            *) echo "Unexpected temporary directory; refusing cleanup" >&2; exit 1 ;;
          esac

  frontend:
    runs-on: [self-hosted, Linux, thinkpad]
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
      - name: Retain isolated checkouts for fourteen days
        if: runner.environment == 'self-hosted'
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(path.join(process.env.GITHUB_WORKSPACE, 'work'));
          const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
          for (const name of fs.readdirSync(root)) {
            if (!/^[0-9]+-[0-9]+-[A-Za-z0-9_-]+-[0-9]+$/.test(name)) continue;
            const target = path.join(root, name);
            const stat = fs.lstatSync(target);
            if (!stat.isDirectory() || stat.isSymbolicLink() || stat.mtimeMs >= cutoff) continue;
            if (!fs.realpathSync(target).startsWith(root + path.sep)) throw new Error('Unsafe cleanup path');
            fs.rmSync(target, {recursive: true, force: true});
          }
      # Each registration has its own _work root; each job checks out a fresh subdirectory.
      # GitHub Runner cleans RUNNER_TEMP and terminates processes carrying this job's tracking ID.
      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chromium Unix sockets require a short path, even when _work is deeply nested.
          job_tmp=$(mktemp -d /tmp/gha.XXXXXX)
          echo "CI_JOB_TEMP=$job_tmp" >> "$GITHUB_ENV"
          mkdir -p "$job_tmp" "$HOME/.cache"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/frontend/package-lock.json
      - run: npm ci
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/frontend
      - run: npm test
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/frontend
      - run: npx playwright install chromium
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/frontend
      - run: flock "$HOME/.cache/thinkpad-actions-browser.lock" npm run test:visual
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/frontend
      - run: npm run build
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/frontend
      - name: Remove this job's Linux temporary directory
        if: always() && runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          case "${CI_JOB_TEMP:-}" in
            /tmp/gha.*) rm -rf -- "$CI_JOB_TEMP" ;;
            '') ;;
            *) echo "Unexpected temporary directory; refusing cleanup" >&2; exit 1 ;;
          esac

  docker:
    runs-on: [self-hosted, Linux, thinkpad]
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
      - name: Retain isolated checkouts for fourteen days
        if: runner.environment == 'self-hosted'
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(path.join(process.env.GITHUB_WORKSPACE, 'work'));
          const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
          for (const name of fs.readdirSync(root)) {
            if (!/^[0-9]+-[0-9]+-[A-Za-z0-9_-]+-[0-9]+$/.test(name)) continue;
            const target = path.join(root, name);
            const stat = fs.lstatSync(target);
            if (!stat.isDirectory() || stat.isSymbolicLink() || stat.mtimeMs >= cutoff) continue;
            if (!fs.realpathSync(target).startsWith(root + path.sep)) throw new Error('Unsafe cleanup path');
            fs.rmSync(target, {recursive: true, force: true});
          }
      # Each registration has its own _work root; each job checks out a fresh subdirectory.
      # GitHub Runner cleans RUNNER_TEMP and terminates processes carrying this job's tracking ID.
      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chromium Unix sockets require a short path, even when _work is deeply nested.
          job_tmp=$(mktemp -d /tmp/gha.XXXXXX)
          echo "CI_JOB_TEMP=$job_tmp" >> "$GITHUB_ENV"
          mkdir -p "$job_tmp" "$HOME/.cache"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - name: Build production image
        run: docker build --tag compcat-ci:${{ github.run_id }}-${{ github.run_attempt }} .
      - name: Import, migrate, boot, and probe the Python 3.14 production image
        run: sh scripts/smoke-production-image.sh compcat-ci:${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify ops entry points without network or live data
        run: |
          docker build -f deploy/ingest-cron.Dockerfile -t compcat-ops-ci:${{ github.run_id }}-${{ github.run_attempt }} .
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/deploy,target=/source,readonly" \
            --mount "type=bind,source=$PWD/tests,target=/tests,readonly" \
            compcat-ops-ci:${{ github.run_id }}-${{ github.run_attempt }} sh /tests/ops_entrypoint_smoke.sh
      - name: Production overlay publishes only the Caddy edge
        env:
          POSTGRES_PASSWORD: ci-not-a-real-password
          MCA_DATABASE_URL: postgresql+psycopg://mca:ci-not-a-real-password@db:5432/mca
          MCA_ASSISTANT_TOKEN_BUDGET_PER_DAY: "0"
          MCA_RATE_LIMIT_ENABLED: "true"
        run: |
          docker compose --env-file /dev/null \
            -f docker-compose.yml -f docker-compose.prod.yml config > rendered.yml
          # "! cmd" is exempt from set -e; an if/exit keeps the assertion load-bearing.
          for port in 5432 8000; do
            if grep -q "published: \"$port\"" rendered.yml; then
              echo "prod overlay must not publish $port — caddy is the only ingress" >&2
              exit 1
            fi
          done
          grep -q 'published: "80"' rendered.yml
          grep -q 'published: "443"' rendered.yml
          grep -q 'caddy:2-alpine' rendered.yml
          grep -q 'MCA_ASSISTANT_TOKEN_BUDGET_PER_DAY' rendered.yml
          test "$(grep -c 'restart: unless-stopped' rendered.yml)" = "3"
      - name: Ingest sidecar renders only under the ops profile
        env:
          POSTGRES_PASSWORD: ci-not-a-real-password
          MCA_DATABASE_URL: postgresql+psycopg://mca:ci-not-a-real-password@db:5432/mca
          MCA_ASSISTANT_TOKEN_BUDGET_PER_DAY: "0"
          MCA_RATE_LIMIT_ENABLED: "true"
          MCA_ADMIN_INGEST_TOKEN: ci-not-a-real-token
        run: |
          docker compose --env-file /dev/null --profile ops \
            -f docker-compose.yml -f docker-compose.prod.yml config > rendered-ops.yml
          grep -q 'ingest-cron' rendered-ops.yml
          grep -q 'target: /etc/crontabs/root' rendered-ops.yml
          grep -q 'target: /etc/ingest/backup.sh' rendered-ops.yml
          grep -q 'target: /backups' rendered-ops.yml
          # rendered.yml is the previous step's no-profile render: the sidecar must be absent.
          if grep -q 'ingest-cron' rendered.yml; then
            echo "sidecar must not render without --profile ops" >&2
            exit 1
          fi
      - name: Remove job-created Docker images
        if: always()
        run: docker image rm compcat-ci:${{ github.run_id }}-${{ github.run_attempt }} compcat-ops-ci:${{ github.run_id }}-${{ github.run_attempt }} || true
      - name: Remove this job's Linux temporary directory
        if: always() && runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          case "${CI_JOB_TEMP:-}" in
            /tmp/gha.*) rm -rf -- "$CI_JOB_TEMP" ;;
            '') ;;
            *) echo "Unexpected temporary directory; refusing cleanup" >&2; exit 1 ;;
          esac
