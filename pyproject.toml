[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compcat-analyzer"
version = "0.1.0"
description = "Privacy-first reported incident analysis for selected places."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "anthropic>=0.40",
  "fastapi>=0.115",
  # SQLAlchemy declares greenlet only on selected machine architectures. Keep it explicit so
  # a lock generated on Apple Silicon still contains the dependency required by Linux images.
  "greenlet>=1",
  "httpx>=0.27",
  "openai>=1.40",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.data" = ["*.csv", "*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
